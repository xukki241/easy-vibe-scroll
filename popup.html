<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Smooth Scroll Free</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
      }
      body {
        margin: 0;
        width: 240px;
        padding: 14px;
        color: #2a2f36;
      }
      h1 {
        margin: 0 0 6px;
        font-size: 1rem;
        color: #2f6fed;
      }
      p {
        margin: 0 0 12px;
        font-size: 0.82rem;
        color: #6b7280;
        line-height: 1.35;
      }
      button {
        width: 100%;
        border: 0;
        border-radius: 6px;
        padding: 9px 12px;
        background: #2f6fed;
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        background: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <h1>Smooth Scroll Free</h1>
    <p>Smooth mouse-wheel scrolling with pulse easing.</p>
    <button id="openOptions" type="button">Open settings</button>
    <script src="popup.js"></script>
  </body>
</html>
